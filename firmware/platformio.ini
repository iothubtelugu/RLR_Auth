; PlatformIO Project Configuration File for RLR ESP32 Fingerprint Node
; Robotics Lab of RKV (RLR)

[platformio]
src_dir = rlr_esp32_attendance
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Serial Monitor & Upload Port Settings
monitor_speed = 115200
upload_speed = 921600

; Required External Libraries
lib_deps =
    adafruit/Adafruit Fingerprint Sensor Library @ ^2.1.3
    bblanchon/ArduinoJson @ ^6.21.4

; Build Flags
build_flags = 
    -D CORE_DEBUG_LEVEL=0
